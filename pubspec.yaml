name: aptabase_flutter
description: "Flutter SDK for Aptabase: Open Source Privacy-First and Simple Analytics for Mobile, Desktop and Web Apps"
version: 0.4.1
homepage: https://aptabase.com
repository: https://github.com/aptabase/aptabase_flutter
issue_tracker: https://github.com/aptabase/aptabase_flutter/issues

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: 
    git:
      url: https://gitee.com/openharmony-sig/flutter_plus_plugins
      path: packages/package_info_plus/package_info_plus
  device_info_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins
      path: packages/device_info_plus/device_info_plus
  universal_io: ^2.2.2
  shared_preferences: 
    git:
      url: https://gitee.com/openharmony-sig/flutter_packages
      path: packages/shared_preferences/shared_preferences

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
